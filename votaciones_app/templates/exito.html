<!DOCTYPE html>
<html>
<head>
<title>Registro exitoso</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
}

.contenedor{
    width:400px;
    margin:120px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    color:green;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#0d6efd;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

a:hover{
    background:#0b5ed7;
}

</style>

</head>

<body>

<div class="contenedor">

<h2>✔ Ciudadano registrado correctamente</h2>

<a href="/">Volver al inicio</a>

</div>

</body>
</html>
