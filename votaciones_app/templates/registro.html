<!DOCTYPE html>
<html>
<head>
<title>Registro de Ciudadanos</title>

<style>

body{
    font-family: Arial;
    background-color: #f4f6f9;
}

.contenedor{
    width:400px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}

</style>

</head>

<body>

<div class="contenedor">

<h2>Registro de Ciudadano</h2>

<form method="POST">

<input type="text" name="numero" placeholder="Número de identificación" required>

<input type="text" name="nombre" placeholder="Nombre completo" required>

<select name="puesto" required>

<option value="">Seleccione su puesto de votación</option>

{% for puesto in puestos %}
<option value="{{ puesto.id }}">{{ puesto.lugar }}</option>
{% endfor %}

</select>

<button type="submit">Registrar ciudadano</button>

</form>

</div>

</body>
</html>
